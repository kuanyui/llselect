# GitLab Pages: verify, build, publish the site assembled by build:site
# (README-rendered landing page + demo + dist + angularjs, all static).
# The whole pipeline is `npm run verify` - the same single command run
# locally and by the GitHub workflow. Tests gate the deploy: a red suite
# never replaces a working demo site.
pages:
  image: node:22
  stage: deploy
  script:
    - npm ci
    - npm run verify
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
