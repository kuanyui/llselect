# GitLab Pages: verify, build, publish the demos as-is.
# The demos are plain static HTML referencing ../dist and ../../angularjs,
# so public/ just mirrors that repo layout. No site generator involved.
# Tests gate the deploy: a red suite never replaces a working demo site.
pages:
  image: node:22
  stage: deploy
  script:
    - npm ci
    - npm run check
    - npm run build
    - npm test
    - cd angularjs && npm ci && npm test && cd ..
    - mkdir -p public/angularjs
    - cp -r demo dist public/
    - cp angularjs/*.js angularjs/README.md public/angularjs/
    - printf '<meta http-equiv="refresh" content="0; url=demo/">' > public/index.html
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
