# GitLab Pages: verify, build, publish the site assembled by build:site
# (README-rendered landing page + demo + dist + angularjs, all static).
# Tests gate the deploy: a red suite never replaces a working demo site.
pages:
  image: node:22
  stage: deploy
  script:
    - npm ci
    - npm run check
    - npm run build
    - npm test
    - cd angularjs && npm ci && npm test && cd ..
    - npm run build:site
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
