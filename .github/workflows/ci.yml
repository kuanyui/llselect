# Test on every push and PR. On a green master push, assemble the static
# site (README-rendered landing + demo + dist + angularjs) and deploy it to
# this repo's own GitHub Pages: https://<owner>.github.io/llselect/.
# The user-site repo (<owner>.github.io, the blog) is never touched: a
# project site owns its /llselect/ path and takes priority over any
# same-named path in the user site. One-time setup on the GitHub mirror:
# Settings -> Pages -> Source: GitHub Actions.
name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # same single pipeline as local dev and .gitlab-ci.yml
      - run: npm run verify
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          path: public
  deploy-pages:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
